appId: com.ledgerai.luca
productName: Luca

directories:
  output: ../dist-installer

win:
  icon: public/luca.ico
  target: nsis
  artifactName: Luca-Setup-${version}.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Luca

files:
  - "dist/**/*"
  - "electron/**/*"
  - "!node_modules"

extraResources:
  - from: "../backend"
    to: "app/backend"
  - from: "../python-embed"
    to: "python"
  - from: "../knowledge_base"
    to: "app/knowledge_base"
  - from: "../database"
    to: "app/database"
  - from: "../.env"
    to: "app/.env"