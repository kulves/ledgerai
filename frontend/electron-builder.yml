appId: com.ledgerai.luca
productName: Luca

directories:
  output: ../dist-installer

win:
  target: nsis
  icon: public/Luca.ico
  artifactName: Luca-Setup-${version}.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Luca

files:
  - "dist/**/*"
  - "electron/**/*"
  - "!node_modules"

extraResources:
  - from: "../python-embed"
    to: "python"
    filter:
      - "**/*"
  - from: "../backend"
    to: "app/backend"
  - from: "../knowledge_base"
    to: "app/knowledge_base"
  - from: "../database"
    to: "app/database"
  # NOTE: .env is intentionally NOT bundled here — it holds live secrets
  # (Stripe key, Plaid secret, license signing key). Bundling it would ship
  # those secrets to every person who downloads the installer. config.py
  # already falls back to safe placeholder defaults when no .env is present,
  # which is exactly what beta builds should use.